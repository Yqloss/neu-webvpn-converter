<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebVPN 转换设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>WebVPN 地址转换</h1>
    <form id="settings">
      <label class="toggle"><input type="checkbox" id="enabled"> 启用自动转换</label>
      <label for="mode">转换方向</label>
      <select id="mode">
        <option value="to-vpn">符合正则的网址 → WebVPN</option>
        <option value="to-direct">所有东北大学 WebVPN 链接 → 普通网址</option>
      </select>
      <label for="regex">URL 正则表达式</label>
      <textarea id="regex" rows="5" spellcheck="false" required></textarea>
      <p id="regex-help">匹配完整 URL，忽略大小写；无需填写两端的 /。默认匹配东北大学子域名，排除 ipgw、webvpn、www 及主域名。</p>
      <p id="direct-help" hidden>转普通网址时不使用正则。自动还原地址中的协议、域名、端口和路径；WebVPN 登录页保持原样。嵌套链接会逐层还原。</p>
      <div class="buttons"><button type="button" id="reset">恢复默认正则</button></div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">设置修改后自动保存，下次打开或刷新网址时生效。</p>
  </main>
  <script src="converter.js"></script>
  <script src="settings.js"></script>
</body>
</html>
